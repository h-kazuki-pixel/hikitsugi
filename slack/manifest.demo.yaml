# デモ用ワークスペースの Slack アプリ(hikitsugi-demo)
# api.slack.com/apps → Create New App → From an app manifest に貼る。手順は README「Slack アプリ(demo)」
#
# スコープは設計書 7章で使うものだけ:
#   channels:history  店舗チャンネルの投稿を受け取る(message.channels)
#   im:history        ボットへの DM を受け取る(message.im。引き継ぎ帳への質問)
#   files:read        写真を受け取る(file_shared、files.info → url_private_download)
#   chat:write        受付・聞き返し・回答をスレッドに返す、承認後の声かけを DM で送る
#   im:write          承認後の声かけのために DM を開く(conversations.open)
# 店舗チャンネルが非公開チャンネルの場合は groups:history と message.groups を足す(デモは公開チャンネルで作る)

display_information:
  name: hikitsugi-demo
  description: 無人自習室の清掃報告を受け付け、現場の知識を引き継ぐ(デモ用・架空の店舗)
  background_color: "#2f6f5e"
  long_description: >-
    サンプル自習室(天神店・薬院店)のデモ用アプリです。店舗チャンネルに送られた清掃報告や写真を受け付け、
    スレッドに返事をします。スタッフへの声かけは、オーナーが承認したものだけを DM で送ります。
    ボットへの DM で聞かれた質問には、過去に人が答えた内容から出典つきで答えます。
    店舗・スタッフ・質問はすべて架空のデータです。

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: hikitsugi-demo
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:history
      - im:history
      - files:read
      - chat:write
      - im:write

settings:
  event_subscriptions:
    request_url: https://hikitsugi-demo.h-kazuki.workers.dev/slack/events
    bot_events:
      - message.channels
      - message.im
      - file_shared
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
