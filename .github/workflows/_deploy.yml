# デプロイの本体(demo / production から呼ばれる)
#
# 順番: D1 マイグレーション → (demo だけ)架空の seed → wrangler deploy → Worker の秘密情報 → 動作確認
#
# - Cloudflare のトークンとアカウントID はリポジトリの Secrets(CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)
# - Worker の秘密情報は GitHub の Environment(demo / production)ごとの Secrets に置く。
#   demo と production は Slack アプリもワークスペースも別なので、同じ名前で中身を分ける
# - 秘密情報が未登録なら飛ばす(落とさない)。リポジトリにもログにも値は出さない
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      reset_demo:
        description: demo の D1 を空にしてから、マイグレーションと seed をやり直す(撮影のやり直し用。demo だけ)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID は下の「資格情報を確かめる」で整えてから GITHUB_ENV に入れる
      WRANGLER_SEND_METRICS: "false"
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Secrets を貼り付けるときに末尾の改行や空白が入りやすい(初回の deploy-demo はこれで落ちた)。
      # 空白と改行を取り除き、アカウントID の形を確かめてから、後のステップに渡す
      - name: Cloudflare の資格情報を確かめる(前後の空白・改行は取り除く)
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "::error::GitHub Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"
            exit 1
          fi
          if ! printf '%s' "$account" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID の形が違います(英小文字と数字の32文字のはず)。Cloudflare ダッシュボードの Workers & Pages の右側にあるアカウントID をそのまま登録してください"
            exit 1
          fi
          [ "$token" = "$RAW_TOKEN" ] || echo "::warning::CLOUDFLARE_API_TOKEN に空白か改行が入っていたので取り除きました。Secrets を登録し直すとこの警告は消えます"
          [ "$account" = "$RAW_ACCOUNT" ] || echo "::warning::CLOUDFLARE_ACCOUNT_ID に空白か改行が入っていたので取り除きました。Secrets を登録し直すとこの警告は消えます"
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      # トークンとアカウントで、デプロイに要る操作(D1・Workers・Queues)ができるかを先に確かめる。
      # できなければ、何を直せばよいかを日本語で出して止める(トークンやアカウント名はログに出さない)
      - name: Cloudflare の権限を確かめる
        run: scripts/ci/cf-diagnose.sh "$TARGET_ENV"

      # 撮影のやり直し用。demo のときだけ、全テーブルを消してマイグレーションの記録から当て直す。
      # production では、入力が渡っても止める(二重の守り)
      - name: demo の D1 を空にする(reset-demo のときだけ)
        if: inputs.reset_demo
        run: |
          if [ "$TARGET_ENV" != "demo" ]; then
            echo "::error::reset は demo でしか動かしません"
            exit 1
          fi
          npx wrangler d1 execute DB --remote --env demo --file scripts/ci/reset-demo.sql
          echo "### demo の D1 を空にしました(このあとマイグレーションと seed を当て直します)" >> "$GITHUB_STEP_SUMMARY"

      - name: D1 マイグレーション
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET_ENV"

      - name: 架空の seed(demo だけ。INSERT OR IGNORE なので何度流しても同じ)
        if: inputs.environment == 'demo'
        run: |
          node scripts/build-seed.mjs
          npx wrangler d1 execute DB --remote --env demo --file seed/demo.sql

      # seed の架空の Slack ID(U_DEMO_… / C_DEMO_…)を、デモ用ワークスペースの実際の ID に結びつける。
      # 実際の ID はリポジトリに置かず、demo 環境の Secret「DEMO_SLACK_IDS」から読む(形は scripts/ci/apply-demo-slack-ids.mjs)
      - name: デモ用ワークスペースの Slack ID を結びつける(demo だけ。未登録なら飛ばす)
        if: inputs.environment == 'demo'
        env:
          DEMO_SLACK_IDS: ${{ secrets.DEMO_SLACK_IDS }}
        run: |
          if [ -z "$DEMO_SLACK_IDS" ]; then
            echo "::notice::DEMO_SLACK_IDS は未登録なので飛ばしました(demo)"
            exit 0
          fi
          sql="$RUNNER_TEMP/demo-slack-ids.sql"
          node scripts/ci/apply-demo-slack-ids.mjs "$sql"
          if [ -s "$sql" ]; then
            npx wrangler d1 execute DB --remote --env demo --file "$sql" > /dev/null
          fi

      - name: wrangler deploy
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy --env "$TARGET_ENV" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Worker の秘密情報を流し込む(未登録のものは飛ばす)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ENTRY_WEBHOOK_SECRET: ${{ secrets.ENTRY_WEBHOOK_SECRET }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          names="ANTHROPIC_API_KEY SLACK_SIGNING_SECRET SLACK_BOT_TOKEN ENTRY_WEBHOOK_SECRET"
          if [ "$TARGET_ENV" = "production" ]; then names="$names ACCESS_TEAM_DOMAIN ACCESS_AUD"; fi
          for name in $names; do
            raw="${!name}"
            # 前後の空白・改行を取り除く(末尾の改行が残ると Slack の署名検証などが合わなくなる)
            value="${raw#"${raw%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            [ "$value" = "$raw" ] || echo "::warning::$name の前後に空白か改行が入っていたので取り除きました($TARGET_ENV)"
            if [ -z "$value" ]; then
              echo "::notice::$name は未登録なので飛ばしました($TARGET_ENV)"
              continue
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --env "$TARGET_ENV" > /dev/null
            echo "$name を設定しました($TARGET_ENV)"
          done

      - name: 動作確認
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::デプロイ先の URL を読み取れませんでした。Cloudflare ダッシュボードで workers.dev のサブドメインを確認してください"
            exit 0
          fi
          if [ "$TARGET_ENV" = "demo" ]; then
            path="/stores/tenjin"; expect=200
          else
            # production は、ログインなしでは実店舗の画面が出ないことを確かめる。
            # Access の設定前はコードが 403 を返し、設定後は Access がログイン画面へ転送する(302)
            path="/"; expect="302|401|403"
          fi
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o body.html -w '%{http_code}' "$URL$path" || true)
            printf '%s' "$code" | grep -Eqx "$expect" && break
            sleep 5
          done
          echo "$URL$path → $code(期待値 $expect)"
          printf '%s' "$code" | grep -Eqx "$expect" || { echo "::error::動作確認に失敗しました"; exit 1; }
          if [ "$TARGET_ENV" = "demo" ]; then grep -q "サンプル自習室 天神店" body.html; fi
          {
            echo "### $TARGET_ENV にデプロイしました"
            echo ""
            echo "- URL: $URL$path"
            echo "- 動作確認: $code"
          } >> "$GITHUB_STEP_SUMMARY"
